version: v2
# clean is deliberately NOT set: gen/go is also a hand-authored Go module
# (go.mod/go.sum live at its root), and `clean: true` deletes everything
# under `out` before regenerating — verified the hard way, it wiped go.mod.
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/andytrue7/coinly/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: ../gen/go
    opt: paths=source_relative
